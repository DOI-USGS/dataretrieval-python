# Periodic structural sweep: duplication, coupling, cohesion, dead code, and the
# maintainability trend.
#
# Advisory by design, and nothing here fails the build. These measures move over
# months rather than commits, and they report findings a reviewer has to judge
# rather than obey -- a metric can call good design a violation. The merge gates
# live in python-package.yml. See CONTRIBUTING.md for how to read the output.

name: Code Health

on:
  schedule:
    # 08:00 UTC Mondays: a week's worth of merges, read before the week starts.
    - cron: "0 8 * * 1"
  # On demand, for checking whether a refactor actually moved the numbers.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          # wily indexes git history; a shallow clone gives it one revision to
          # trend against, which is no trend at all.
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install analysis tooling
        run: |
          python -m pip install --upgrade pip
          # ``test`` for the queryables check, which lives in the test suite.
          pip install -e .[metrics,health,test]

      - name: Structural analysis (pyscn)
        # One run writes both the JSON report (the numbers) and the HTML report.
        # Never fails the job -- a non-zero exit here means "findings", which
        # are the point.
        continue-on-error: true
        run: |
          pyscn analyze --json --html --no-open dataretrieval 2>&1 | tee pyscn-summary.txt

      - name: Check the analysis actually resolved the package
        # pyscn infers a project root. If it chose the wrong one, it would
        # resolve only part of the package, which *raises* the score, because
        # most of what it grades is dependency-derived. Its unresolved-import
        # count does not show this: under a wrong root the package's own
        # imports count as external. So compare the root with the checkout and
        # the module count with the files on disk, and print each warning on
        # its own. Missing report keys are named rather than raising, so a
        # renamed key shows in the summary instead of dropping this line.
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY' > pyscn-sanity.txt 2>&1
          import glob, json, os
          reports = sorted(glob.glob(".pyscn/reports/*.json"))
          if not reports:
              print("no pyscn JSON report found"); raise SystemExit
          s = json.load(open(reports[-1])).get("system", {}).get("summary", {})
          keys = ("project_root", "total_modules", "total_dependencies")
          missing = [k for k in keys if k not in s]
          if missing:
              print(f"WARNING: the pyscn report has no system.summary {missing}; "
                    "update this check for the pinned pyscn version.")
              raise SystemExit
          root, modules = s["project_root"], s["total_modules"]
          files = len(glob.glob("dataretrieval/**/*.py", recursive=True))
          print(f"modules={modules} files={files} "
                f"dependencies={s['total_dependencies']} root={root}")
          if os.path.realpath(root) != os.path.realpath(os.getcwd()):
              print(f"WARNING: project root {root!r} is not the checkout; the "
                    "scores above are not comparable to previous runs.")
          if modules < 0.9 * files:
              print(f"WARNING: pyscn analyzed {modules} modules of {files} files; "
                    "import resolution is probably degraded and the scores "
                    "above are not comparable to previous runs.")
          PY
          cat pyscn-sanity.txt

      - name: Maintainability ranking (wily)
        # Worst-maintained files today, and how the package has moved recently.
        run: |
          wily build dataretrieval --max-revisions 50 >/dev/null 2>&1 || true
          {
            echo '## Maintainability ranking'
            echo '```'
            wily rank dataretrieval maintainability.mi 2>&1 | head -25 \
              || echo 'wily index unavailable'
            echo '```'
          } > wily-summary.txt

      - name: Queryables snapshot vs service
        # The merge gate compares getter docstrings with the committed
        # queryables snapshot offline, so it cannot see the snapshot itself
        # go stale; this live read can. It is the refresh command a maintainer
        # runs, with --check so nothing is rewritten. A non-zero exit means
        # drift, or that the service could not be read; the log says which.
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m tests.waterdata_queryables_test --check 2>&1 \
            | tee queryables-drift.txt

      - name: Publish report
        # ``always()`` so a partial report still lands rather than a bare red X.
        if: always()
        run: |
          {
            echo '## Structural analysis'
            echo '```'
            if [[ -s pyscn-summary.txt ]]; then
              cat pyscn-summary.txt
            else
              echo 'pyscn produced no output'
            fi
            cat pyscn-sanity.txt 2>/dev/null || true
            echo '```'
            cat wily-summary.txt 2>/dev/null || true
            echo '## Queryables snapshot vs service'
            echo '```'
            cat queryables-drift.txt 2>/dev/null \
              || echo 'the queryables check produced no output'
            echo '```'
            echo
            echo 'Full reports are attached to this run as the'
            echo '`code-health-report` artifact. Findings are advisory --'
            echo 'read them as leads, not verdicts (see CONTRIBUTING.md).'
            echo 'The merge gates live in the Python package workflow.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-health-report
          path: |
            .pyscn/reports/
            pyscn-summary.txt
            pyscn-sanity.txt
            wily-summary.txt
            queryables-drift.txt
          retention-days: 90
          if-no-files-found: warn
